[package]
name = "po-wasm"
version = "1.0.0"
edition = "2021"
description = "WebAssembly bindings that let the PO Studio website run the same solvers as the desktop app"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
po-core = { path = "../po-core" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
