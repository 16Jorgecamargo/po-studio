<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pesquisa operacional passo a passo no navegador: simplex, Branch & Bound, transporte, redes, CPM, PERT, filas e jogos. Código aberto." />
    <meta name="theme-color" content="#e4e8ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121519" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <title>PO Studio: pesquisa operacional passo a passo</title>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('po-studio:settings') || '{}');
        if (s.theme === 'light' || s.theme === 'dark') document.documentElement.dataset.theme = s.theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>O PO Studio precisa de JavaScript para resolver os problemas no navegador.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
