    <meta name="twitter:card" content="summary" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "PO Studio",
        "alternateName": "PO Studio: pesquisa operacional passo a passo",
        "description": "Pesquisa operacional passo a passo: método simplex (folgas, M grande, duas fases, dual), análise de sensibilidade, método gráfico, programação inteira por Branch & Bound, transporte, árvore geradora mínima, caminho mais curto, fluxo máximo, CPM, PERT, filas e jogos de soma zero. Alternativa livre ao TORA: abre e salva os mesmos arquivos .txt.",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Web, Windows, macOS, Linux",
        "inLanguage": "pt-BR",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "BRL" },
        "license": ["https://opensource.org/licenses/MIT", "https://www.apache.org/licenses/LICENSE-2.0"],
        "downloadUrl": "https://github.com/16Jorgecamargo/po-studio/releases/latest",

        "author": { "@type": "Person", "name": "Jorge Camargo", "url": "https://github.com/16Jorgecamargo" }
      }

    <script>
      try {
        var s = JSON.parse(localStorage.getItem('po-studio:settings') || '{}');
        if (s.theme === 'light' || s.theme === 'dark') document.documentElement.dataset.theme = s.theme;
      } catch (e) {}
    </script>
