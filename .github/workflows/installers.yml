name: installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: TARGETS="aarch64-apple-darwin x86_64-apple-darwin" bash packaging/macos/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: po-studio-macos
          path: dist/*.dmg

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libgl1-mesa-dev libwayland-dev
      - run: bash packaging/linux/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: po-studio-linux
          path: |
            dist/*.deb
            dist/*.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: choco install innosetup -y --no-progress
      - run: pwsh -File packaging/windows/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: po-studio-windows
          path: dist/PO-Studio-*windows*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
